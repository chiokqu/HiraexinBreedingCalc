<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiraexin Breeding Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <script src="https://unpkg.com/papaparse@5.5.3/papaparse.min.js"></script>
    <script type="text/javascript" src="calculator.js" defer></script>
</head>
<body>
    <main class="container p-3">
        <h1>Hiraexin Breeding Calculator</h1>
        <form action="" name="parentsform" id="parentsform">
            <div class="row row-cols-2 g-2">
                    <div class="col col-12 col-md-6">
                        <fieldset class="card p-2 h-100 d-flex align-items-start flex-column">
                            <legend><h2>Parent 1:</h2></legend>
                            <div class="form-check">
                                <label for="special1" class="form-check-label" >Special NPC</label>
                                <input class="form-check-input" type="checkbox" id="special1">
                                <p class="form-text">Only Parent 1 can be chosen as a Special NPC.</p>
                            </div>
                            <div class="input-group my-2">
                                <span class="input-group-text">Subspecies</span>
                                <select name="subspeciesA1" id="subspeciesA1" class="form-select">
                                    <option value="Fire">Fire</option>
                                    <option value="Water">Water</option>
                                    <option value="Nature">Nature</option>
                                    <option value="Thunder">Thunder</option>
                                    <option value="Crystal">Crystal</option>
                                    <option value="Frost">Frost</option>
                                    <option value="Celestial">Celestial</option>
                                    <option value="Star">Star</option>
                                    <option value="Void">Void</option>
                                    <option value="Temporal">Temporal</option>
                                </select>
                                <select name="subspeciesB1" id="subspeciesB1" class="form-select">
                                    <option value=""></option>
                                    <option value="Fire">Fire</option>
                                    <option value="Water">Water</option>
                                    <option value="Nature">Nature</option>
                                    <option value="Thunder">Thunder</option>
                                    <option value="Crystal">Crystal</option>
                                    <option value="Frost">Frost</option>
                                    <option value="Celestial">Celestial</option>
                                    <option value="Star">Star</option>
                                    <option value="Void">Void</option>
                                    <option value="Temporal">Temporal</option>
                                </select>
                            </div>
                            <div class="my-2">
                                <div class="input-group">
                                    <span class="input-group-text">Variant</span>
                                    <select name="variant1" id="variant1" class="form-select">
                                        <option value=""></option>
                                        <option value="Ocean">Ocean (Water)</option>
                                        <option value="Tropical">Tropical (Water)</option>
                                        <option value="Starstruck">Starstruck (Star)</option>
                                        <option value="Future">Future (Temporal)</option>
                                    </select>
                                </div>
                                <p class="form-text text-center">If no variant, leave blank.</p>
                            </div>
                            <div class="mt-auto w-100">
                                <label for="traits1">Traits</label>
                                <select class="form-select traits w-100" name="traits1[]" id="traits1" multiple="multiple">
                                </select>
                            </div>
                        </fieldset>
                    </div>
                    <div class="col col-12 col-md-6">
                        <fieldset class="card p-2 h-100 d-flex align-items-start flex-column">
                            <legend><h2>Parent 2:</h2></legend>
                            <p class="mb-auto fst-italic text-body-secondary">Parent 2 cannot be a Special NPC.</p>
                            <div class="input-group my-2 text-muted">
                                <span class="input-group-text">Subspecies</span>
                                <select name="subspeciesA2" id="subspeciesA2" class="form-select">
                                    <option value="Fire">Fire</option>
                                    <option value="Water">Water</option>
                                    <option value="Nature">Nature</option>
                                    <option value="Thunder">Thunder</option>
                                    <option value="Crystal">Crystal</option>
                                    <option value="Frost">Frost</option>
                                    <option value="Celestial">Celestial</option>
                                    <option value="Star">Star</option>
                                    <option value="Void">Void</option>
                                    <option value="Temporal">Temporal</option>
                                </select>
                                <select name="subspeciesB2" id="subspeciesB2" class="form-select">
                                    <option value=""></option>
                                    <option value="Fire">Fire</option>
                                    <option value="Water">Water</option>
                                    <option value="Nature">Nature</option>
                                    <option value="Thunder">Thunder</option>
                                    <option value="Crystal">Crystal</option>
                                    <option value="Frost">Frost</option>
                                    <option value="Celestial">Celestial</option>
                                    <option value="Star">Star</option>
                                    <option value="Void">Void</option>
                                    <option value="Temporal">Temporal</option>
                                </select>
                            </div>
                            <div class="my-2">
                                <div class="input-group">
                                    <span class="input-group-text">Variant</span>
                                    <select name="variant2" id="variant2" class="form-select">
                                        <option value=""></option>
                                        <option value="Ocean">Ocean (Water)</option>
                                        <option value="Tropical">Tropical (Water)</option>
                                        <option value="Starstruck">Starstruck (Star)</option>
                                        <option value="Future">Future (Temporal)</option>
                                    </select>
                                </div>
                                <p class="form-text text-center">If no variant, leave blank.</p>
                            </div>
                            <div class="w-100">
                                <label for="traits2">Traits</label>
                                <select class="form-select traits w-100" name="traits2[]" id="traits2" multiple="multiple">
                                </select>
                            </div>
                        </fieldset>
                    </div>
                </div>
            <div class="card my-2">
                <input type="submit" value="Calculate" class="btn btn-primary">
            </div>
        <hr>
        <section class="card p-2">
            <h2>Result</h2>
            <p>Parent data:<br>
                <span id="formOutput"></span>
            </p>
            <p>Eggs: <span id="eggNum"></span></p>
            <h3>Kits</h3>
            <p id="kit1">kit1</p>
        </section>
    </main>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
