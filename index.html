<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiraexin Breeding Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.5.3/papaparse.min.js"></script>
    <script type="text/javascript" src="calculator.js" defer></script>
</head>
<body>
    <main class="container p-3">
        <h1>Hiraexin Breeding Calculator</h1>
        <p>Info: Don't add ribbon number. If not hybrid, only put subspecies in first box!</p>
        <form action="" name="parentsform" id="parentsform">
            <h2>Parent 1:</h2>
            <p>
                <label for="">Is Special NPC?</label>
                <input type="checkbox" id="special1">
            </p>
            <p>
                <label for="subspeciesA1">Subspecies</label>
                <select name="subspeciesA1" id="subspeciesA1">
                    <option value="Fire">Fire</option>
                    <option value="Water">Water</option>
                    <option value="Nature">Nature</option>
                    <option value="Thunder">Thunder</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Frost">Frost</option>
                    <option value="Celestial">Celestial</option>
                    <option value="Star">Star</option>
                    <option value="Void">Void</option>
                    <option value="Temporal">Temporal</option>
                </select>
                <select name="subspeciesB1" id="subspeciesB1">
                    <option value=""></option>
                    <option value="Fire">Fire</option>
                    <option value="Water">Water</option>
                    <option value="Nature">Nature</option>
                    <option value="Thunder">Thunder</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Frost">Frost</option>
                    <option value="Celestial">Celestial</option>
                    <option value="Star">Star</option>
                    <option value="Void">Void</option>
                    <option value="Temporal">Temporal</option>
                </select>
            </p>
            <p>
                <label for="variant1">Variant (blank if none)</label>
                <select name="variant1" id="variant1">
                    <option value=""></option>
                    <option value="Ocean">Ocean (Water)</option>
                    <option value="Tropical">Tropical (Water)</option>
                    <option value="Starstruck">Starstruck (Star)</option>
                    <option value="Future">Future (Temporal)</option>
                </select>
            </p>
            <p>
                <label for="traits1">Traits</label>
                <select class="traits w-100" name="traits1[]" id="traits1" multiple="multiple">
                </select>
            </p>
            <hr>
            <h2>Parent 2:</h2>
            <p>
                <label for="subspeciesA2">Subspecies</label>
                <select name="subspeciesA2" id="subspeciesA2">
                    <option value="Fire">Fire</option>
                    <option value="Water">Water</option>
                    <option value="Nature">Nature</option>
                    <option value="Thunder">Thunder</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Frost">Frost</option>
                    <option value="Celestial">Celestial</option>
                    <option value="Star">Star</option>
                    <option value="Void">Void</option>
                    <option value="Temporal">Temporal</option>
                </select>
                <select name="subspeciesB2" id="subspeciesB2">
                    <option value=""></option>
                    <option value="Fire">Fire</option>
                    <option value="Water">Water</option>
                    <option value="Nature">Nature</option>
                    <option value="Thunder">Thunder</option>
                    <option value="Crystal">Crystal</option>
                    <option value="Frost">Frost</option>
                    <option value="Celestial">Celestial</option>
                    <option value="Star">Star</option>
                    <option value="Void">Void</option>
                    <option value="Temporal">Temporal</option>
                </select>
            </p>
            <p>
                <label for="variant2">Variant (blank if none)</label>
                <select name="variant2" id="variant2">
                    <option value=""></option>
                    <option value="Ocean">Ocean (Water)</option>
                    <option value="Tropical">Tropical (Water)</option>
                    <option value="Starstruck">Starstruck (Star)</option>
                    <option value="Future">Future (Temporal)</option>
                </select>
            </p>
            <p>
                <label for="traits2">Traits (separate with comma - don't add rarity)</label>
                <select class="traits w-100" name="traits2[]" id="traits2" multiple="multiple">
                </select>
            </p>
            <p>
                <input type="submit">
            </p>
        </form>
        <hr>
        <p id="formOutput">form output</p>
        <p id="eggNum">eggs</p>
        <p id="kit1">kit1</p>
    </main>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
